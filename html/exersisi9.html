<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Formulari de contacte</title>
</head>
<body>
  <h1>Formulari</h1>

  <form action="#" method="post">
    
    <label for="nom">Nom:</label><br>
    <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required><br><br>

    <label for="email">Correu electrònic:</label><br>
    <input type="email" id="email" name="email" placeholder="exemple@correu.com" required><br><br>

    <label for="missatge">Missatge:</label><br>
    <textarea id="missatge" name="missatge" rows="5" cols="30" placeholder="Escriu aquí el teu missatge..."></textarea><br><br>

    <input type="submit" value="Enviar">
  </form>
</body>
</html>
