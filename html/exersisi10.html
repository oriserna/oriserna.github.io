<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <title>Crear un compte</title>
</head>
<body>
  <h1>Crear un compte</h1>

  <form action="#" method="post">

    <label for="nom">Nom</label><br>
    <input type="text" id="nom" name="nom" placeholder="Escriu el teu nom" required><br><br>

    <label for="email">Correu electrònic</label><br>
    <input type="email" id="email" name="email" placeholder="exemple@correu.com" required><br><br>

    <label for="contrasenya">Contrasenya</label><br>
    <input type="password" id="contrasenya" name="contrasenya" placeholder="Introdueix una contrasenya" required><br><br>

    <input type="checkbox" id="termes" name="termes" required>
    <label for="termes">Accepto els <a href="#">termes i condicions</a></label><br><br>

    <input type="submit" value="Crear compte">
  </form>
</body>
</html>
