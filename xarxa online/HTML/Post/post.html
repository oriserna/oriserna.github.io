    <main>
          <div class="container">
            <h3>Publica les teves fotos</h3>
            <form id="postForm">
              <input type="text" id="title" placeholder="Títol" required>
              <textarea id="description" placeholder="Descripció" rows="4" required></textarea>
              <input type="file" id="imageInput" accept="image/*" required>
              <button type="submit">Publica</button>
            </form>
            <div id="postsContainer">
              <!-- Aquí se mostrarán las publicaciones -->
            </div>

            <div class="comment-container">
              <h3>Publica els teus comentaris</h3>
              <form id="commentForm">
              <textarea id="commentInput" placeholder="Escriu un comentari..." rows="3" required></textarea>
              <button type="submit">Publica comentari</button>
              </form>
            </div>

            <div id="postsContainer">
              <!-- Aquí se mostrarán las publicaciones -->
            </div>
          </div>
    </main>
