<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Conversa</title>
  <link rel="stylesheet" href="../chat/css/conversa.css" />
  <link rel="icon" href="../../IMAGENES/logo/logo blanc i vermell.png">
</head>
<body>
  <div class="chat-container">
    <div class="chat-header">
      <img src="../../IMAGENES/martin.png" alt="Perfil" class="profile-pic">
      <h2>Martin</h2>
    </div>

    <div class="chat-messages" id="chat-messages">
      <!-- Aquí se mostrarán los mensajes -->
      <div class="message left">
        <p>¡Hola! ¿Cóm estás?</p>
      </div>
      <div class="message right">
        <p>Bé, ¿i tú?</p>
      </div>
      <div class="message left">
        <p>Amb ganas de començar l'entrenament</p>
      </div>
      <div class="message right">
        <p>¡Perfecte!🔥</p>
      </div>
    </div>

    <div class="chat-input">
      <input type="text" id="message-input" placeholder="Escriu un missatge..." />
      <button id="send-button">Enviar</button>
    </div>
  </div>
  <script src="../chat/css/java conversa/conversa.java"></script>
</body>
</html>
