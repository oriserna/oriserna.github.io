<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Comentaris</title>
  <link rel="stylesheet" href="./css/comentaris.css">
  <link rel="shortcut icon" href="../../IMAGENES/logo/logo blanc i vermell.png" type="image/x-icon">
</head>
<body>
    <div class="container">
      <img src="../../IMAGENES/SUBIDAS POR USUARIOS/mariona.jpg" alt="Publicació" class="post-image">
  
      <div class="comments-section">
        <div class="comment">
          <img src="../../IMAGENES/elena.jpg" alt="Elena">
          <div class="comment-content">
            <span class="username">@Elena</span>
            M’encanta la foto! 🔥
          </div>
        </div>
  
        <div class="comment">
          <img src="../../IMAGENES/martin.png" alt="Martin">
          <div class="comment-content">
            <span class="username">@Martin</span>
            Totalment d'acord, bona feina 💪
          </div>
        </div>
  
        <div class="comment">
          <img src="../../IMAGENES/josep-garcia-portrait-2024.avif" alt="Mariona">
          <div class="comment-content">
            <span class="username">@josep</span>
            Quina inspiració 💖
          </div>
        </div>
      </div>
  
      <div class="add-comment">
        <input type="text" placeholder="Escriu un comentari...">
        <button>Publicar</button>
      </div>
    </div>
    <script src="./java/publicar comentaris.js"></script>
</body>
</html>
