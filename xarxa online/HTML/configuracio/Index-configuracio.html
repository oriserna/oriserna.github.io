<!-- Archivo HTML -->
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configuración</title>
    <link rel="stylesheet" href="./css/CSS.css">
    <link rel="icon" href="../../IMAGENES/logo/logo blanc i vermell.png">
</head>
<body>
    <header>
        <div class="logo">
            <a href="../Inici.html" target="_self">
                <img src="../../IMAGENES/logo/logo sense fondo.png" alt="Descripción de la imagen" style="width:90px;">
            </a>
        </div>
        <nav>
            <ul>
                <li><a href="../Publicacions/publicacions.html">Publicacions</a></li>
                <li><a href="../Post/post.html">Post</a></li>
                <li><a href="../chat/chat.html">Chat</a></li>
                <li><a href="../Perfil/Index_Perfil.html">Perfil</a></li>
                <li><a href="../Notificacions/index-Notificacions.html" class="active">Notificacions</a></li>
                <li><a href="../../../web Fitverse online/index.html">Web</a></li>
            </ul>
        </nav>
    </header>
    <div class="config-container">
        <h1>Configuració</h1>

        <!-- Idioma -->
        <div class="config-section">
            <h2>Canvi d'idioma</h2>
            <select id="language">
                <option value="es">Español</option>
                <option value="en">Anglés</option>
                <option value="fr">Francés</option>
            </select>
        </div>

        <!-- Tema -->
        <div class="config-section">
            <h2>Tema</h2>
            <div class="toggle">
                <label for="darkMode">Fosc</label>
                <input type="checkbox" id="darkMode">
            </div>
        </div>

        <!-- Notificaciones -->
        <div class="config-section">
            <h2>Notificacions</h2>
            <div class="toggle">
                <label for="notifications">Activar notificacions</label>
                <input type="checkbox" id="notifications">
            </div>
        </div>

        <!-- Conexión con otras cuentas -->
        <div class="config-section">
            <h2>Conexió amb altres comptes</h2>
            <button id="connectGoogle">Conectar amb Google</button>
            <button id="connectFacebook">Conectar amb Facebook</button>
        </div>


        <!-- Seguridad -->
        <div class="config-section">
            <h2>Seguridad</h2>
            <label for="password">Cambiar contrasenya</label>
            <input type="password" id="password" placeholder="Nova contrasenya">
        </div>

        <!-- Preferencias de usuario -->
        <div class="config-section">
            <h2>Preferencies del usuari</h2>
            <label for="username">Nom d'usuari</label>
            <input type="text" id="username" placeholder="Ingresa el teu nom d'usuari">
        </div>

        <!-- Sincronización de datos -->
        <div class="config-section">
            <h2>Sincronització de dades</h2>
            <button id="syncData">Sincronitza ara</button>
        </div>
    </div>

    <script src="../configuracio/JAava/java configuracio.js"></script>
</body>
</html>
